<!DOCTYPE html>
<html lang="ta" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>EndLess — Reporter Panel</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script>
        const CLOUDINARY_CONFIG = { cloudName: 'df2pc8kd0', uploadPreset: 'endless_unsigned' };
        async function uploadToCloudinary(file) {
            if (!file) return null;
            var formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_CONFIG.uploadPreset);
            try {
                var r = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CONFIG.cloudName + '/image/upload', { method: 'POST', body: formData });
                var data = await r.json();
                if (data.secure_url) return data.secure_url;
            } catch (e) { console.error('Upload failed:', e); }
            return null;
        }
    </script>
    <style>
        :root { --rep-primary: #e11d48; }
        .rep-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: #ffffff; border-bottom: 2px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .rep-brand { display: flex; align-items: center; gap: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 800; font-size: 1.35rem; color: #0f172a; }
        .rep-brand span { color: var(--rep-primary); }
        .rep-user { color: #94a3b8; font-size: 0.9rem; }
        .rep-main { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }
        .rep-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .rep-card h3 { margin: 0 0 1rem 0; color: #0f172a; font-size: 1.1rem; font-weight: 700; }
        .rep-form input, .rep-form textarea, .rep-form select { width: 100%; padding: 0.75rem; margin-bottom: 0.75rem; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 8px; color: #0f172a; font-family: inherit; font-size: 1rem; }
        .rep-form textarea { min-height: 120px; resize: vertical; }
        .rep-form label { display: block; margin-bottom: 0.3rem; color: #94a3b8; font-size: 0.9rem; font-weight: 600; }
        .rep-btn { padding: 0.75rem 1.5rem; background: linear-gradient(135deg, var(--rep-primary), #be123c); color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; }
        .rep-btn:hover { opacity: 0.9; }
        .rep-btn-secondary { background: #334155; margin-left: 0.5rem; }
        .rep-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        .rep-table th, .rep-table td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #1e293b; }
        .rep-table th { color: #94a3b8; font-weight: 600; }
        .rep-table td { color: #e2e8f0; }
        .rep-status { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
        .rep-status.published { background: #052e16; color: #4ade80; }
        .rep-status.draft { background: #1e293b; color: #94a3b8; }
        .rep-edit-btn { padding: 0.4rem 0.8rem; background: #1e40af; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .rep-blocked { background: #450a0a; color: #f87171; padding: 1rem; border-radius: 8px; text-align: center; }
    </style>
<base target="_blank">
</head>
<body>
    <div class="rep-header">
        <div class="rep-brand"><span style="width:38px;height:38px;background:linear-gradient(135deg,#e11d48,#be123c);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif;font-weight:900;color:#fff;font-size:1.25rem;box-shadow:0 4px 12px rgba(225,29,72,0.3);">E</span><span style="color:#0f172a;letter-spacing:-0.02em;margin-left:6px;">End</span><span style="color:#e11d48;letter-spacing:-0.02em;">Less</span><span style="font-weight:600;font-size:0.9rem;color:#64748b;margin-left:6px;">Reporter</span></div>
        <button id="rep-profile-btn" style="display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border:2px solid #e2e8f0;border-radius:999px;background:#fff;cursor:pointer;transition:all 0.2s;font-family:inherit;" onclick="repToggleProfileMenu(event)">
                <span id="rep-avatar" style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#e11d48,#be123c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;overflow:hidden;">👤</span>
                <span id="rep-username-display" style="font-weight:700;font-size:0.9rem;color:#0f172a;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Loading...</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" style="width:14px;height:14px;"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
    </div>

    <div class="rep-main" id="rep-main">
        <!-- New Article Form -->
        <div class="rep-card">
            <h3>📝 Publish New Article</h3>
            <form class="rep-form" id="rep-article-form">
                <input type="hidden" id="rep-edit-id">
                <div class="lang-tabs" style="display:flex;gap:0.5rem;margin-bottom:0.75rem;border-bottom:2px solid #e5e7eb;padding-bottom:0.5rem;">
                    <button type="button" class="rep-lang-tab active" data-lang="ta" onclick="repSwitchLang('ta')" style="padding:0.5rem 1rem;border:none;background:#e11d48;color:#fff;font-weight:700;border-radius:8px 8px 0 0;cursor:pointer;">தமிழ்</button>
                    <button type="button" class="rep-lang-tab" data-lang="en" onclick="repSwitchLang('en')" style="padding:0.5rem 1rem;border:none;background:#f3f4f6;color:#374151;font-weight:700;border-radius:8px 8px 0 0;cursor:pointer;">English</button>
                </div>

                <!-- TAMIL FIELDS (default) -->
                <div id="rep-fields-ta">
                    <label>Headline (Tamil) *</label>
                    <input type="text" id="rep-title-ta" placeholder="தலைப்பு" required>
                    <label>Excerpt / Summary (Tamil)</label>
                    <textarea id="rep-excerpt-ta" rows="2" placeholder="சுருக்கம்..."></textarea>
                    <label>Full Content (Tamil) *</label>
                    <textarea id="rep-content-ta" placeholder="முழு செய்தி..." required style="min-height:180px;"></textarea>
                </div>

                <!-- ENGLISH FIELDS (hidden) -->
                <div id="rep-fields-en" style="display:none;">
                    <label>Headline (English)</label>
                    <input type="text" id="rep-title-en" placeholder="English headline (optional)">
                    <label>Excerpt (English)</label>
                    <textarea id="rep-excerpt-en" rows="2" placeholder="Summary..."></textarea>
                    <label>Full Content (English)</label>
                    <textarea id="rep-content-en" placeholder="English article..." style="min-height:180px;"></textarea>
                </div>
                <label>Category *</label>
                <select id="rep-category" required>
                    <option value="">Select category</option>
                    <option value="Local">Local (இலங்கை)</option>
                    <option value="World">World (உலகம்)</option>
                    <option value="Technology">Technology</option>
                    <option value="Business">Business</option>
                    <option value="Sports">Sports</option>
                    <option value="Health">Health</option>
                    <option value="Science">Science</option>
                </select>
                <label>📸 News Image *</label>
                <div style="border:2px dashed #d1d5db;border-radius:12px;padding:1.5rem;text-align:center;background:#f9fafb;cursor:pointer;margin-bottom:0.5rem;" id="rep-drop-zone" onclick="document.getElementById('rep-img-file').click()">
                    <div id="rep-img-placeholder">
                        <span style="font-size:2rem;">📷</span>
                        <p style="font-weight:600;margin:0.5rem 0 0.25rem;color:#374151;">Click to upload photo</p>
                        <small style="color:#9ca3af;">Auto-upload to Cloudinary!</small>
                    </div>
                    <img id="rep-img-preview" src="" alt="" style="max-width:100%;max-height:150px;border-radius:8px;display:none;margin:0 auto;">
                </div>
                <input type="file" id="rep-img-file" accept="image/*" multiple style="display:none;" onchange="repUploadImages(this.files)">
                <div id="rep-img-gallery" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;"></div>
                <small style="color:#059669;font-size:0.75rem;display:block;margin-top:4px;">💡 Tip: <strong>1st image = Head image</strong> (hero). Other images = article gallery below.</small>
                <input type="hidden" id="rep-image">
                <input type="text" id="rep-image-url" placeholder="...or paste image URL" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;margin-bottom:0.5rem;font-size:0.85rem;">
                <label>👤 Author (auto-filled)</label>
                <input type="text" id="rep-author" required readonly style="background:#f3f4f6;cursor:not-allowed;font-weight:600;">
                <small style="color:#9ca3af;font-size:0.75rem;display:block;margin-bottom:0.5rem;">Auto — your registered reporter name</small>
                <div style="margin-top:1rem;">
                    <button type="submit" class="rep-btn" id="rep-publish-btn">🚀 Publish Article</button>
                    <button type="button" class="rep-btn rep-btn-secondary" id="rep-cancel-edit" style="display:none;">Cancel Edit</button>
                </div>
            </form>
        </div>

        <!-- My Articles List -->
        <div class="rep-card">
            <h3>📰 My Published Articles</h3>
            <div id="rep-articles-list" style="color:#94a3b8;">Loading...</div>
        </div>
    </div>

    <script>
        // Firebase init
        const firebaseConfig = {
            apiKey: "AIzaSyDXcTKDUxqcwJ5g0spGM4PlDqKfKQX7nYA",
            authDomain: "endless-news.firebaseapp.com",
            projectId: "endless-news",
            storageBucket: "endless-news.firebasestorage.app",
            messagingSenderId: "363216005373",
            appId: "1:363216005373:web:143fb950fb04dfc1cb7694"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 🌟 PROFILE MENU — avatar, name, image upload, view site, sign out
        let _repProfileMenu = null;

        function repToggleProfileMenu(e) {
            e.stopPropagation();
            if (_repProfileMenu) { _repProfileMenu.remove(); _repProfileMenu = null; return; }

            _repProfileMenu = document.createElement('div');
            _repProfileMenu.style.cssText = 'position:fixed;top:64px;right:16px;width:300px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,0.15);z-index:10000;overflow:hidden;font-family:inherit;';

            _repProfileMenu.innerHTML = 
                '<div style="padding:20px;text-align:center;border-bottom:1px solid #f1f5f9;">' +
                '  <div style="position:relative;display:inline-block;margin-bottom:12px;">' +
                '    <span id="menu-avatar" style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#e11d48,#be123c);color:#fff;display:flex;align-items:center;justify-content:center;font-family:\'Playfair Display\',Georgia,serif;font-weight:900;font-size:28px;overflow:hidden;cursor:pointer;" onclick="document.getElementById(\'rep-avatar-file\').click()" title="Click to change photo">' + repGetAvatarHTML() + '</span>' +
                '    <span style="position:absolute;bottom:0;right:0;width:22px;height:22px;background:#e11d48;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff;" onclick="document.getElementById(\'rep-avatar-file\').click()"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" style="width:12px;height:12px;"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>' +
                '  </div>' +
                '  <input type="file" id="rep-avatar-file" accept="image/*" style="display:none;" onchange="repUploadAvatar(this.files[0])">' +
                '  <div style="font-weight:800;font-size:1.05rem;color:#0f172a;margin-bottom:2px;">' + (currentReporter ? currentReporter.name : 'Reporter') + '</div>' +
                '  <div style="font-size:0.8rem;color:#64748b;">@' + (currentReporter ? currentReporter.username : '') + '</div>' +
                '  <div style="margin-top:6px;"><span style="background:#fef2f2;color:#e11d48;font-size:0.65rem;font-weight:800;padding:2px 10px;border-radius:999px;letter-spacing:0.05em;">REPORTER</span></div>' +
                '</div>' +
                '<div style="padding:8px;">' +
                '  <button onclick="window.open(\'index.html\',\'_blank\'); repCloseMenu();" style="width:100%;padding:10px 12px;border:none;background:none;text-align:left;color:#0f172a;font-weight:600;cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:0.9rem;"><svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" style="width:18px;height:18px;"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>🌐 View Main Website</button>' +
                '  <button onclick="repSignOut(); repCloseMenu();" style="width:100%;padding:10px 12px;border:none;background:none;text-align:left;color:#dc2626;font-weight:600;cursor:pointer;border-radius:8px;margin-top:4px;display:flex;align-items:center;gap:10px;font-size:0.9rem;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out</button>' +
                '</div>';

            document.body.appendChild(_repProfileMenu);

            // Close on outside click
            setTimeout(function() {
                document.addEventListener('click', function closeMenu(e) {
                    if (_repProfileMenu && !_repProfileMenu.contains(e.target)) {
                        _repProfileMenu.remove();
                        _repProfileMenu = null;
                        document.removeEventListener('click', closeMenu);
                    }
                });
            }, 100);
        }

        function repCloseMenu() {
            if (_repProfileMenu) { _repProfileMenu.remove(); _repProfileMenu = null; }
        }

        function repGetAvatarHTML() {
            var img = currentReporter && currentReporter.photo;
            if (img) return '<img src="' + img + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
            return (currentReporter ? currentReporter.name.charAt(0).toUpperCase() : 'R');
        }

        async function repUploadAvatar(file) {
            if (!file) return;
            alert('☁️ Uploading profile photo...');
            var url = await uploadToCloudinary(file);
            if (url && currentReporter) {
                // Save to Firestore
                await db.collection('reporters').doc(currentReporter.username).update({
                    photo: url
                });
                currentReporter.photo = url;
                repUpdateAvatarUI();
                alert('✅ Profile photo updated!');
                if (_repProfileMenu) { _repProfileMenu.remove(); _repProfileMenu = null; repToggleProfileMenu({stopPropagation:function(){}}); }
            }
        }

        function repUpdateAvatarUI() {
            var avatar = document.getElementById('rep-avatar');
            if (avatar && currentReporter) {
                avatar.innerHTML = repGetAvatarHTML();
            }
        }

        function repSignOut() {
            sessionStorage.removeItem('reporter_session');
            window.location.href = 'usereport88.html';
        }

        let currentReporter = null;

        // Check session
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'usereport88.html';
                return;
            }
            const session = JSON.parse(sessionStorage.getItem('reporter_session') || '{}');
            if (!session.username) {
                await auth.signOut();
                window.location.href = 'usereport88.html';
                return;
            }

            // Get reporter data
            const repDoc = await db.collection('reporters').doc(session.username).get();
            if (!repDoc.exists || repDoc.data().blocked) {
                document.getElementById('rep-main').innerHTML = '<div class="rep-blocked">🚫 Account blocked or not found. Contact admin.</div>';
                await auth.signOut();
                return;
            }

            currentReporter = { username: session.username, ...repDoc.data() };
            var dispName = currentReporter.name.split(' ')[0];
            document.getElementById('rep-username-display').textContent = dispName;
            repUpdateAvatarUI();
            // Auto-fill author
            document.getElementById('rep-author').value = currentReporter.name;
            loadMyArticles();
        });

        // Load my articles only
        async function loadMyArticles() {
            const list = document.getElementById('rep-articles-list');
            try {
                // ⭐ Query: filter by reporterId (fallback if index missing)
                let snapshot;
                try {
                    snapshot = await db.collection('news')
                        .where('reporterId', '==', currentReporter.username)
                        .get();
                } catch (indexErr) {
                    console.warn('Index missing, fetching all:', indexErr);
                    // Fallback: fetch all + filter client-side
                    const allSnap = await db.collection('news').get();
                    const filtered = allSnap.docs.filter(d => d.data().reporterId === currentReporter.username);
                    snapshot = { empty: filtered.length === 0, docs: filtered, forEach: (cb) => filtered.forEach(d => cb(d)) };
                }

                // Sort by date desc (client-side — no index needed)
                const docs = [];
                snapshot.forEach(doc => docs.push(doc));
                docs.sort((a, b) => new Date(b.data().date || 0) - new Date(a.data().date || 0));

                if (docs.length === 0) {
                    list.innerHTML = '<p style="text-align:center;padding:2rem;color:#64748b;">No articles yet. Publish your first news! 📝</p>';
                    return;
                }

                let html = '<table class="rep-table"><thead><tr><th>Title</th><th>Category</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody>';
                docs.forEach(doc => {
                    const a = doc.data();
                    const title = a.title_ta || a.title_en || 'Untitled';
                    const date = a.date ? new Date(a.date).toLocaleDateString('ta-IN') : '-';
                    const status = a.status === 'draft' ? '<span class="rep-status draft">Draft</span>' : '<span class="rep-status published">Published</span>';
                    html += `<tr>
                        <td>${title.substring(0, 50)}${title.length > 50 ? '...' : ''}</td>
                        <td>${a.category_en || a.category || '-'}</td>
                        <td>${date}</td>
                        <td>${status}</td>
                        <td><button class="rep-edit-btn" onclick="editArticle('${doc.id}')">Edit</button></td>
                    </tr>`;
                });
                html += '</tbody></table>';
                list.innerHTML = html;
            } catch (e) {
                console.error('Load error:', e);
                list.innerHTML = '<div style="text-align:center;padding:2rem;color:#dc2626;"><p style="font-weight:700;">⚠️ Error loading articles</p><p style="font-size:0.85rem;color:#64748b;margin:0.5rem 0;">' + (e.message || e) + '</p><button onclick="loadMyArticles()" style="padding:8px 20px;background:#e11d48;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">🔄 Retry</button></div>';
            }
        }

        // Publish new article
        document.getElementById('rep-article-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('rep-publish-btn');
            btn.disabled = true;
            btn.textContent = 'Publishing...';

            try {
                const editId = document.getElementById('rep-edit-id').value;
                const articleData = {
                    reporterId: currentReporter.username,   // ⭐ IMPORTANT: for "My Articles" filter!
                    title_ta: document.getElementById('rep-title-ta').value.trim(),
                    title_en: document.getElementById('rep-title-en').value.trim() || document.getElementById('rep-title-ta').value.trim(),
                    excerpt: document.getElementById('rep-excerpt-ta').value.trim(),
                    excerpt_en: document.getElementById('rep-excerpt-en').value.trim() || document.getElementById('rep-excerpt-ta').value.trim(),
                    content: document.getElementById('rep-content-ta').value.trim(),
                    content_en: document.getElementById('rep-content-en').value.trim() || document.getElementById('rep-content-ta').value.trim(),
                    category: document.getElementById('rep-category').value,
                    category_en: document.getElementById('rep-category').value,
                    author: document.getElementById('rep-author').value.trim(),
                    author_en: document.getElementById('rep-author').value.trim(),
                    image: document.getElementById('rep-image').value.trim() || 'https://via.placeholder.com/800x400?text=EndLess+News',
                    images: _repImages.length > 1 ? _repImages.slice(1) : [],   // ⭐ Gallery (skip head)
                    date: new Date().toISOString(),
                    status: 'published',
                    reporterId: currentReporter.username,
                    reporterName: currentReporter.name,
                    lastModified: new Date().toISOString()
                };

                if (editId) {
                    // Edit own article only
                    await db.collection('news').doc(editId).update(articleData);
                    alert('✅ Article updated!');
                } else {
                    // Create new
                    const docRef = await db.collection('news').add(articleData);
                    console.log('Published:', docRef.id);
                    alert('✅ Article published to EndLess News!');
                }

                // Reset form
                document.getElementById('rep-article-form').reset();
                document.getElementById('rep-edit-id').value = '';
                document.getElementById('rep-publish-btn').textContent = '🚀 Publish Article';
                document.getElementById('rep-cancel-edit').style.display = 'none';
                loadMyArticles();

            } catch (err) {
                alert('❌ Error: ' + err.message);
            } finally {
                btn.disabled = false;
            }
        });

        // Edit article (own only)
        window.editArticle = async (id) => {
            try {
                const doc = await db.collection('news').doc(id).get();
                if (!doc.exists || doc.data().reporterId !== currentReporter.username) {
                    alert('You can only edit your own articles!');
                    return;
                }
                const a = doc.data();
                document.getElementById('rep-edit-id').value = id;
                document.getElementById('rep-title-ta').value = a.title_ta || '';
                document.getElementById('rep-title-en').value = a.title_en || '';
                document.getElementById('rep-excerpt').value = a.excerpt || '';
                document.getElementById('rep-content').value = a.content || '';
                document.getElementById('rep-category').value = a.category_en || a.category || '';
                document.getElementById('rep-image').value = a.image || '';
                document.getElementById('rep-author').value = a.author || '';
                document.getElementById('rep-publish-btn').textContent = '💾 Update Article';
                document.getElementById('rep-cancel-edit').style.display = 'inline-block';
                window.scrollTo({top: 0, behavior: 'smooth'});
            } catch (e) {
                alert('Error loading article');
            }
        };

        // Cancel edit
        // 🌐 Language switch
        let _repLang = 'ta';
        function repSwitchLang(lang) {
            _repLang = lang;
            document.querySelectorAll('.rep-lang-tab').forEach(function(t) {
                var isActive = t.dataset.lang === lang;
                t.style.background = isActive ? '#e11d48' : '#f3f4f6';
                t.style.color = isActive ? '#fff' : '#374151';
            });
            document.getElementById('rep-fields-ta').style.display = lang === 'ta' ? 'block' : 'none';
            document.getElementById('rep-fields-en').style.display = lang === 'en' ? 'block' : 'none';
        }

        // 📸 Image upload
        // 📸 Multi-image upload — 1st = Head, others = Gallery
        let _repImages = [];

        async function repUploadImages(files) {
            if (!files || !files.length) return;
            var filesArr = Array.from(files);

            alert('☁️ Uploading ' + filesArr.length + ' image(s) to Cloudinary...');

            for (var i = 0; i < filesArr.length; i++) {
                var url = await uploadToCloudinary(filesArr[i]);
                if (url) {
                    _repImages.push(url);
                }
            }

            repRefreshImageUI();
            alert('✅ ' + _repImages.length + ' image(s) uploaded! 1st = Head image.');
        }

        function repRefreshImageUI() {
            var hidden = document.getElementById('rep-image');
            var gallery = document.getElementById('rep-img-gallery');
            var placeholder = document.getElementById('rep-img-placeholder');
            var preview = document.getElementById('rep-img-preview');

            if (!hidden || !gallery) return;

            // Set head image (1st)
            if (_repImages.length > 0) {
                hidden.value = _repImages[0];
                document.getElementById('rep-image-url').value = _repImages[0];
                placeholder.style.display = 'none';
                preview.src = _repImages[0];
                preview.style.display = 'block';
            } else {
                hidden.value = '';
                document.getElementById('rep-image-url').value = '';
                placeholder.style.display = 'block';
                preview.style.display = 'none';
            }

            // Render gallery (all images)
            gallery.innerHTML = '';
            _repImages.forEach(function(url, idx) {
                var isHead = idx === 0;
                var div = document.createElement('div');
                div.style.cssText = 'position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;border:3px solid ' + (isHead ? '#e11d48' : '#e2e8f0') + ';';
                div.innerHTML = 
                    '<img src="' + url + '" style="width:100%;height:100%;object-fit:cover;cursor:pointer;" onclick="repSetHead(' + idx + ')" title="Click to make Head image">' +
                    (isHead ? '<span style="position:absolute;top:2px;left:2px;background:#e11d48;color:#fff;font-size:0.6rem;font-weight:800;padding:1px 6px;border-radius:4px;">HEAD</span>' : '<span style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,0.6);color:#fff;font-size:0.55rem;font-weight:700;padding:1px 5px;border-radius:4px;opacity:0;transition:opacity 0.2s;" class="set-head-hint">Set Head</span>') +
                    '<button type="button" onclick="event.stopPropagation(); repRemoveImage(' + idx + ')" style="position:absolute;top:2px;right:2px;width:20px;height:20px;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:50%;font-size:12px;cursor:pointer;line-height:1;" title="Remove">×</button>';
                // Hover effect — show "Set Head" hint
                div.addEventListener('mouseenter', function() { var h = div.querySelector('.set-head-hint'); if (h) h.style.opacity = '1'; });
                div.addEventListener('mouseleave', function() { var h = div.querySelector('.set-head-hint'); if (h) h.style.opacity = '0'; });
                gallery.appendChild(div);
            });
        }

        // 👑 Tap any photo → Make it HEAD image
        function repSetHead(idx) {
            if (idx === 0) return;  // Already head
            var selected = _repImages[idx];
            _repImages.splice(idx, 1);       // Remove from position
            _repImages.unshift(selected);    // Add to front (index 0)
            repRefreshImageUI();
            alert('✅ Set as Head Image!');
        }

        function repRemoveImage(idx) {
            _repImages.splice(idx, 1);
            repRefreshImageUI();
        }

        // Backward compatibility (single file)
        async function repUploadImage(file) {
            if (!file) return;
            await repUploadImages([file]);
        }
        document.getElementById('rep-image-url').addEventListener('input', function() {
            var url = this.value.trim();
            if (url.indexOf('http') === 0) {
                document.getElementById('rep-image').value = url;
                document.getElementById('rep-img-placeholder').style.display = 'none';
                var prev = document.getElementById('rep-img-preview');
                prev.src = url;
                prev.style.display = 'block';
            }
        });

        document.getElementById('rep-cancel-edit').addEventListener('click', () => {
            _repImages = [];
            repRefreshImageUI();
            document.getElementById('rep-article-form').reset();
            document.getElementById('rep-edit-id').value = '';
            document.getElementById('rep-publish-btn').textContent = '🚀 Publish Article';
            document.getElementById('rep-cancel-edit').style.display = 'none';
        });
    </script>
</body>
</html>
